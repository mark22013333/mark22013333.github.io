<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheng's workbench</title>
<meta name="description" content="Cheng 的作品入口：部落格 Cheng's Tech & Life，以及線上服務、Claude Code plugin、桌面 App 與 CLI 工具。">
<meta property="og:title" content="Cheng's workbench">
<meta property="og:description" content="部落格、線上服務、Claude Code plugin、桌面 App 與 CLI 工具。">
<meta property="og:url" content="https://mark22013333.github.io/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1318'/%3E%3Ctext x='5' y='23' font-family='monospace' font-size='18' font-weight='700' fill='%23e6b450'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="alternate" type="application/atom+xml" title="Cheng's Tech & Life" href="https://blog.longhopick.com/atom.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0e1318; --panel:#121a21; --line:#243039; --ink:#c9d1d9; --bright:#f0f3f6;
  --dim:#6b7682; --soft:#9aa6b2; --amber:#e6b450; --cyan:#7fbfd9; --green:#8fcf8f;
  --mono:"JetBrains Mono","Noto Sans TC","Heiti TC","Microsoft JhengHei",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.75 var(--mono);padding-inline:clamp(16px,5vw,64px);padding-block:clamp(28px,6vw,72px)}
main{max-width:1040px;margin:0 auto;display:grid;gap:40px}
a{color:inherit}
a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.p{color:var(--amber)} .k{color:var(--cyan)} .dim{color:var(--dim)} .ok{color:var(--green)}
.cmd{margin:0 0 10px}
h1{font:600 clamp(22px,3.2vw,32px)/1.3 var(--mono);color:var(--bright);margin:6px 0 0;overflow-wrap:anywhere}
.cursor{display:inline-block;width:.6em;height:1.05em;background:var(--amber);vertical-align:-.15em;margin-left:4px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
.who{color:var(--soft);margin:10px 0 0;max-width:64ch}
.blog{border:1px solid var(--line);background:var(--panel);padding:16px 18px;display:grid;gap:4px}
.blog a.post{display:grid;grid-template-columns:11ch 1fr;gap:14px;text-decoration:none;padding:2px 0}
.blog a.post:hover .t{color:var(--amber)}
.blog time{color:var(--dim);font-variant-numeric:tabular-nums}
.blog .more{margin-top:8px;text-decoration:none}
.blog .more:hover{text-decoration:underline;text-underline-offset:3px}
.ls{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th{font-weight:400;color:var(--dim);text-align:left;padding:4px 18px 4px 0;white-space:nowrap}
td{padding:6px 18px 6px 0;vertical-align:top;white-space:nowrap;font-variant-numeric:tabular-nums}
td.d{white-space:normal;color:var(--soft);font-family:"Noto Sans TC",var(--mono);font-size:14px}
tbody tr:hover td{background:var(--panel)}
td a{color:var(--cyan);font-weight:600;text-decoration:none}
td a:hover{text-decoration:underline;text-underline-offset:3px}
.t-service{color:var(--green)} .t-plugin{color:var(--cyan)} .t-app{color:var(--amber)} .t-cli{color:var(--ink)}
footer{color:var(--dim);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:6px 20px}
footer a{color:var(--soft)}
@media (max-width:600px){ .blog a.post{grid-template-columns:1fr;gap:0} }
</style>
</head>
<body>
<main>
  <header>
    <div class="dim"># Cheng's workbench</div>
    <h1><span class="p">cheng@longhopick</span>:<span class="k">~</span>$ whoami<span class="cursor" aria-hidden="true"></span></h1>
    <p class="who">Java／Spring 後端工程師。下班時間寫部落格，也做一些自己每天會用的服務和 Claude Code 工具，全都列在下面。</p>
  </header>

  <section class="blog" aria-labelledby="blog-h">
    <p class="cmd" id="blog-h"><span class="p">$</span> tail -n 3 blog.longhopick.com/latest.json</p>
    <div id="posts"><span class="dim">讀取最新文章…</span></div>
    <a class="more ok" href="https://blog.longhopick.com">→ 前往 Cheng's Tech &amp; Life（blog.longhopick.com）</a>
  </section>

  <section aria-labelledby="ls-h">
    <p class="cmd" id="ls-h"><span class="p">$</span> ls -l ~/projects</p>
    <div class="ls">
      <table>
        <thead><tr><th>類型</th><th>★</th><th>更新</th><th>名稱</th><th>說明</th></tr></thead>
        <tbody id="projects"><tr><td colspan="5" class="dim">讀取作品清單…</td></tr></tbody>
      </table>
    </div>
    <noscript><p>作品清單需要 JavaScript。也可以直接到 <a href="https://github.com/mark22013333">github.com/mark22013333</a> 看。</p></noscript>
  </section>

  <footer>
    <span><span class="p">$</span> exit</span>
    <a href="https://github.com/mark22013333">GitHub</a>
    <a href="https://blog.longhopick.com/atom.xml">RSS</a>
  </footer>
</main>

<script>
(function () {
  var GH = 'mark22013333';

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  // 最新文章：由部落格 build 時產生的 latest.json 提供；部落格連不上時只留下方連結
  fetch('https://blog.longhopick.com/latest.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (posts) {
      var box = document.getElementById('posts');
      box.textContent = '';
      posts.slice(0, 3).forEach(function (p) {
        var a = el('a', { 'class': 'post', href: p.url });
        a.appendChild(el('time', { datetime: p.date }, p.date));
        a.appendChild(el('span', { 'class': 't' }, p.title));
        box.appendChild(a);
      });
    })
    .catch(function () {
      document.getElementById('posts').innerHTML = '<span class="dim">暫時讀不到最新文章，直接前往部落格看。</span>';
    });

  // 作品清單：projects.json；星數與更新日期即時向 GitHub 取，失敗就顯示「-」
  fetch('projects.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var tbody = document.getElementById('projects');
      tbody.textContent = '';
      data.projects.forEach(function (p) {
        var tr = el('tr');
        tr.appendChild(el('td', { 'class': 't-' + p.type }, p.type));
        var star = el('td', {}, '-');
        var upd = el('td', {}, '-');
        tr.appendChild(star);
        tr.appendChild(upd);
        var name = el('td');
        name.appendChild(el('a', { href: p.url }, p.name));
        tr.appendChild(name);
        tr.appendChild(el('td', { 'class': 'd' }, p.desc));
        tbody.appendChild(tr);
        if (p.repo) {
          fetch('https://api.github.com/repos/' + GH + '/' + p.repo)
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function (g) {
              star.textContent = g.stargazers_count;
              upd.textContent = (g.pushed_at || '').slice(0, 10) || '-';
            })
            .catch(function () {});
        }
      });
    });
})();
</script>
</body>
</html>
