# ChatPulse 作品介紹頁的內容。改完執行 python3 tools/build_sites.py chatpulse 重新產生 /chatpulse/。
# 欄位說明見 _sites/sshm/content.yml 開頭的註解。
#
# 截圖重拍：sh _sites/chatpulse/seed/serve.sh <ChatPulse clone> <venv python> <工作目錄> <port>
#           再跑 _sites/chatpulse/seed/shoot.cjs（用法寫在該檔開頭）。
#   後端是真實的 ChatPulse，資料庫是全新的 SQLite，內容全部來自 seed/fixture.json（虛構）。
#   Space 清單、訊息內容、Mention 的訊息文字在正式程式裡一律即時向 Google Chat 取、不落地，
#   截圖時改由瀏覽器端用 fixture 回應這三個端點；其餘畫面資料都由真實後端讀資料庫回傳。

slug: chatpulse
name: ChatPulse
tagline: Google Chat 的摘要與 Mention 收件匣，用你本人的身分讀寫。
accent: '#2762c4'          # 取自儀表板淺色主題的 accent（dashboard/frontend/src/index.css 的 --signal）
github: https://github.com/mark22013333/ChatPulse

eyebrow:
  kind: Web 儀表板＋MCP
  meta: [Python 3.12, FastAPI, React]

lede: '查閱自己加入的 Space、產出結構化 Summary，並在被人 @ 時取得一份可修改的 Draft Reply。讀寫 Google Chat 一律使用<b>你本人的 OAuth 憑證</b>，不註冊 Chat App、不用機器人身分發話。儀表板與 CLI 的送出動作都需要二次確認；MCP 入口的送出由 Claude 端的工具權限把關。'

